name: Java CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test, and package
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t cen4802taskmanager:${{ github.sha }} .

      - name: Save Docker image
        run: docker save cen4802taskmanager:${{ github.sha }} -o cen4802taskmanager.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: cen4802taskmanager-image
          path: cen4802taskmanager.tar
          retention-days: 7